name: Decentralized Stack Verification (CI)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  validate-stack:
    name: Run Protocol Integration Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Setup Stable Rust Toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt
        targets: wasm32-unknown-unknown

    - name: Install System Dependencies (Nym & Reticulum Network Layers)
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libssl-dev pkg-config libclang-dev

    - name: Cache Cargo Dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Verify Code Formatting
      run: cargo fmt --check

    - name: Run Code Analysis (Clippy Warnings & Security Audits)
      run: cargo clippy --all-targets --all-features -- -D warnings

    - name: Test Core Protocol Integration Suites
      # This step executes individual workspace tests across all integrated modules
      run: |
        echo "⚡ Testing Nostr Relays & Key Operations..."
        cargo test --package janavani-nostr --lib
        
        echo "🔎 Testing Nym Sphinx Packet Routing..."
        cargo test --package janavani-nym --lib
        
        echo "📡 Testing Reticulum Mesh Off-Grid Packets..."
        cargo test --package janavani-reticulum --lib
        
        echo "🔒 Verifying ZKP Arithmetic Circuit Proofs..."
        cargo test --package janavani-zkp --lib
        
        echo "⛓ Testing Blockchain Smart Contract Bridges & Event Logs..."
        cargo test --package janavani-blockchain --lib

    - name: Test Freenet State Compilations
      # Verifies the WASM compilation target layers specifically required for Freenet
      run: |
        echo "🛠️ Verifying Freenet Contract WASM compilation target..."
        cargo build --target wasm32-unknown-unknown --all-features
